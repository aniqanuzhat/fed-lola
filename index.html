<!-- Firebase App & Realtime Database SDKs (Compat Version for plain HTML/JS) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <script>
    // Firebase Config using your keys
    const firebaseConfig = {
      apiKey: "AIzaSyAf4T7QPuiae3qBQePxH7K-Xz6nG7JUsh4",
      authDomain: "fed-lola.firebaseapp.com",
      databaseURL: "https://fed-lola-default-rtdb.firebaseio.com",
      projectId: "fed-lola",
      storageBucket: "fed-lola.firebasestorage.app",
      messagingSenderId: "1024504801806",
      appId: "1:1024504801806:web:053d531697417928366a5f"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Initialize EmailJS
    (function() {
      emailjs.init("YOUR_EMAILJS_PUBLIC_KEY");
    })();

    // Listen for live database updates
    db.ref('lastFed').on('value', (snapshot) => {
      const val = snapshot.val();
      document.getElementById('lastFedTime').innerText = val ? val : "Not yet fed";
    });

    // Handle button tap
    async function feedLola() {
      const btn = document.getElementById('feedButton');
      const statusDiv = document.getElementById('status');

      btn.disabled = true;
      statusDiv.innerText = "Updating & sending text...";

      const now = new Date();
      const formattedTime = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + 
                            " on " + now.toLocaleDateString([], { month: 'short', day: 'numeric' });

      try {
        // 1. Write timestamp to Firebase
        await db.ref('lastFed').set(formattedTime);

        // 2. Trigger EmailJS SMS to roommates
        const serviceID = "YOUR_SERVICE_ID";
        const templateID = "YOUR_TEMPLATE_ID";
        await emailjs.send(serviceID, templateID);

        statusDiv.innerText = "✅ Saved & SMS sent!";
      } catch (error) {
        console.error("Error:", error);
        statusDiv.innerText = "⚠️ Updated page, but SMS failed.";
      } finally {
        setTimeout(() => { btn.disabled = false; }, 3000);
      }
    }
  </script>
