<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fed Lola</title>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <!-- EmailJS SDK -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #faf5ef;
    }

    .container {
      text-align: center;
      padding: 20px;
      max-width: 400px;
      width: 100%;
    }

    .cat-photo {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #ffffff;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }

    h1 {
      color: #333;
      margin-top: 0;
      margin-bottom: 10px;
    }

    .timestamp-box {
      background: #ffffff;
      padding: 12px 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      font-size: 16px;
      color: #555;
    }

    .timestamp-box strong {
      color: #222;
    }

    .feed-btn {
      background-color: #ff6b6b;
      color: white;
      border: none;
      border-radius: 50px;
      padding: 18px 45px;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255, 107, 107, 0.4);
      transition: transform 0.15s ease, background-color 0.2s ease;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      width: 100%;
    }

    .feed-btn:active {
      transform: scale(0.95);
      background-color: #ee5253;
    }

    .feed-btn:disabled {
      background-color: #cccccc;
      box-shadow: none;
      cursor: not-allowed;
    }

    #status {
      margin-top: 15px;
      font-size: 15px;
      font-weight: 600;
      color: #666;
      min-height: 24px;
    }

    .history-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 15px 20px;
      margin-top: 25px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      text-align: left;
    }

    .history-card h3 {
      margin: 0 0 10px 0;
      font-size: 16px;
      color: #444;
      border-bottom: 1px solid #eee;
      padding-bottom: 8px;
    }

    .history-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .history-list li {
      padding: 6px 0;
      font-size: 14px;
      color: #666;
      border-bottom: 1px solid #fafafa;
    }

    .history-list li:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="lola.jpg" alt="Lola" class="cat-photo" onerror="this.style.display='none'">
    
    <h1>Fed Lola Today? 🐾</h1>
    
    <div class="timestamp-box">
      Last Fed: <strong id="lastFedTime">Loading...</strong>
    </div>

    <button id="feedButton" class="feed-btn" onclick="feedLola()">FED LOLA</button>
    <div id="status"></div>

    <div class="history-card">
      <h3>Recent Feeding History</h3>
      <ul id="historyList" class="history-list">
        <li>Loading history...</li>
      </ul>
    </div>
  </div>

  <script>
    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyAf4T7QPuiae3qBQePxH7K-Xz6nG7JUsh4",
      authDomain: "fed-lola.firebaseapp.com",
      databaseURL: "https://fed-lola-default-rtdb.firebaseio.com",
      projectId: "fed-lola",
      storageBucket: "fed-lola.firebasestorage.app",
      messagingSenderId: "1024504801806",
      appId: "1:1024504801806:web:053d531697417928366a5f"
    };

    // EmailJS Config
    const EMAILJS_PUBLIC_KEY = "dEdp_FsFVP6CqWvui"; 
    const EMAILJS_SERVICE_ID = "service_mbl99xl";
    const EMAILJS_TEMPLATE_ID = "template_3iksf9m";

    // Initialize Firebase & EmailJS
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    emailjs.init(EMAILJS_PUBLIC_KEY);

    // Listen for most recent feeding time
    db.ref('lastFed').on('value', (snapshot) => {
      const val = snapshot.val();
      const target = document.getElementById('lastFedTime');
      if (target) {
        target.innerText = val ? val : "Not yet fed";
      }
    });

    // Listen for history log updates (shows last 5)
    db.ref('history').limitToLast(5).on('value', (snapshot) => {
      const historyList = document.getElementById('historyList');
      historyList.innerHTML = '';

      if (!snapshot.exists()) {
        historyList.innerHTML = '<li>No history recorded yet.</li>';
        return;
      }

      const items = [];
      snapshot.forEach((child) => {
        items.push(child.val());
      });

      items.reverse().forEach((timeStr) => {
        const li = document.createElement('li');
        li.innerText = `🐾 ${timeStr}`;
        historyList.appendChild(li);
      });
    });

    // Record feeding & send alert
    async function feedLola() {
      const btn = document.getElementById('feedButton');
      const statusDiv = document.getElementById('status');

      btn.disabled = true;
      statusDiv.innerText = "Updating...";

      const now = new Date();
      const formattedTime = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + 
                            " on " + now.toLocaleDateString([], { month: 'short', day: 'numeric' });

      try {
        // Write to Firebase
        await Promise.all([
          db.ref('lastFed').set(formattedTime),
          db.ref('history').push(formattedTime)
        ]);

        // Send EmailJS SMS
        statusDiv.innerText = "Sending SMS...";
        await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID);
        statusDiv.innerText = "✅ Saved & SMS sent!";
      } catch (error) {
        console.error("Error:", error);
        statusDiv.innerText = "⚠️ Saved time, but SMS failed.";
      } finally {
        setTimeout(() => { 
          btn.disabled = false; 
        }, 3000);
      }
    }
  </script>
</body>
</html>
