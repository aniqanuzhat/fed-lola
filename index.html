<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fed Lola</title>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f7f3ee;
      color: #3d312a;
    }

    .container {
      text-align: center;
      padding: 24px;
      max-width: 380px;
      width: 100%;
      box-sizing: border-box;
    }

    .cat-photo {
      width: 170px;
      height: 170px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #ffffff;
      box-shadow: 0 8px 20px rgba(61, 49, 42, 0.12);
      margin-bottom: 20px;
    }

    h1 {
      color: #3d312a;
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 26px;
    }

    .timestamp-box {
      background: #ffffff;
      border: 1px solid #e8decb;
      padding: 14px 20px;
      border-radius: 14px;
      margin-bottom: 22px;
      box-shadow: 0 4px 12px rgba(61, 49, 42, 0.05);
      font-size: 16px;
      color: #6e5c4f;
    }

    .timestamp-box strong {
      color: #3d312a;
      display: block;
      margin-top: 4px;
      font-size: 18px;
    }

    .feed-btn {
      background-color: #8c6239;
      color: #ffffff;
      border: none;
      border-radius: 50px;
      padding: 18px 40px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(140, 98, 57, 0.3);
      transition: transform 0.15s ease, background-color 0.2s ease;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      width: 100%;
    }

    .feed-btn:active {
      transform: scale(0.96);
      background-color: #704d2b;
    }

    .feed-btn:disabled {
      background-color: #c4b5a5;
      box-shadow: none;
      cursor: not-allowed;
    }

    #status {
      margin-top: 14px;
      font-size: 15px;
      font-weight: 600;
      color: #8c6239;
      min-height: 22px;
    }

    .history-card {
      background: #ffffff;
      border: 1px solid #e8decb;
      border-radius: 14px;
      padding: 16px 20px;
      margin-top: 22px;
      box-shadow: 0 4px 12px rgba(61, 49, 42, 0.05);
      text-align: left;
    }

    .history-card h3 {
      margin: 0 0 10px 0;
      font-size: 15px;
      color: #6e5c4f;
      border-bottom: 1px solid #f0e8dc;
      padding-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .history-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .history-list li {
      padding: 8px 0;
      font-size: 14px;
      color: #3d312a;
      border-bottom: 1px solid #f7f3ee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-list li:last-child {
      border-bottom: none;
    }

    .history-text {
      flex: 1;
      padding-right: 8px;
      word-break: break-word;
    }

    .action-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 15px;
      padding: 4px 6px;
      border-radius: 6px;
      transition: background-color 0.2s ease;
      margin-left: 4px;
    }

    .action-btn:hover {
      background-color: #f0e8dc;
    }

    .edit-btn {
      color: #8c6239;
    }

    .delete-btn {
      color: #c0392b;
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="lola.jpg" alt="Lola" class="cat-photo" onerror="this.style.display='none'">
    
    <h1>Fed Lola Today? 🐾</h1>
    
    <div class="timestamp-box">
      Last Fed: <strong id="lastFedTime">Loading...</strong>
    </div>

    <button id="feedButton" class="feed-btn" onclick="feedLola()">FED LOLA</button>
    <div id="status"></div>

    <div class="history-card">
      <h3>Recent Feeding History</h3>
      <ul id="historyList" class="history-list">
        <li>Loading history...</li>
      </ul>
    </div>
  </div>

  <script>
    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyAf4T7QPuiae3qBQePxH7K-Xz6nG7JUsh4",
      authDomain: "fed-lola.firebaseapp.com",
      databaseURL: "https://fed-lola-default-rtdb.firebaseio.com",
      projectId: "fed-lola",
      storageBucket: "fed-lola.firebasestorage.app",
      messagingSenderId: "1024504801806",
      appId: "1:1024504801806:web:053d531697417928366a5f"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const daysOfWeek = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

    // Helper to format time without leading zeros (e.g., "5:25 AM")
    function formatTimeWithoutLeadingZero(dateObj) {
      let hours = dateObj.getHours();
      const minutes = dateObj.getMinutes().toString().padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      hours = hours ? hours : 12; // '0' hours becomes '12'
      return `${hours}:${minutes} ${ampm}`;
    }

    // Dynamic date parsing to handle both ISO strings and legacy string formats
    function formatRelativeDate(val) {
      if (!val) return "Not yet fed";

      const now = new Date();
      const currentDayName = daysOfWeek[now.getDay()];
      const yesterdayDayName = daysOfWeek[(now.getDay() + 6) % 7];

      // Standard ISO timestamp path
      let date = new Date(val);
      if (!isNaN(date.getTime())) {
        const timeStr = formatTimeWithoutLeadingZero(date);
        const todayZero = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const targetZero = new Date(date.getFullYear(), date.getMonth(), date.getDate());
        const diffDays = Math.round((todayZero - targetZero) / (1000 * 60 * 60 * 24));

        if (diffDays === 0) return `${timeStr} Today`;
        if (diffDays === 1) return `${timeStr} Yesterday`;
        return `${timeStr} on ${daysOfWeek[date.getDay()]}`;
      }

      // Legacy plain-text parsing ("05:25 AM on Friday" or "5:25 AM on Friday")
      const match = val.match(/^(\d{1,2}:\d{2}\s?[AP]M)\s+on\s+([A-Za-z]+)$/i);
      if (match) {
        let timeStr = match[1].replace(/^0/, ''); // Trim leading zero from time string
        const recordDay = match[2];

        if (recordDay.toLowerCase() === currentDayName.toLowerCase()) {
          return `${timeStr} Today`;
        }
        if (recordDay.toLowerCase() === yesterdayDayName.toLowerCase()) {
          return `${timeStr} Yesterday`;
        }
        return `${timeStr} on ${recordDay}`;
      }

      return val.replace(/^0/, '');
    }

    // Sync "Last Fed" display with latest entry
    function updateLastFedFromHistory() {
      db.ref('history').limitToLast(1).get().then((snapshot) => {
        if (snapshot.exists()) {
          snapshot.forEach((child) => {
            db.ref('lastFed').set(child.val());
          });
        } else {
          db.ref('lastFed').set(null);
        }
      });
    }

    // Listen for most recent feeding time
    db.ref('lastFed').on('value', (snapshot) => {
      const val = snapshot.val();
      const target = document.getElementById('lastFedTime');
      if (target) {
        target.innerText = formatRelativeDate(val);
      }
    });

    // Fetch and display strictly the last 5 feedings
    db.ref('history').limitToLast(5).on('value', (snapshot) => {
      const historyList = document.getElementById('historyList');
      historyList.innerHTML = '';

      if (!snapshot.exists()) {
        historyList.innerHTML = '<li>No history recorded yet.</li>';
        return;
      }

      const items = [];
      snapshot.forEach((child) => {
        items.push({ key: child.key, val: child.val() });
      });

      // Show newest first
      items.reverse().forEach((item) => {
        const li = document.createElement('li');

        const textSpan = document.createElement('span');
        textSpan.className = 'history-text';
        textSpan.innerText = `🐾 ${formatRelativeDate(item.val)}`;

        const actionsDiv = document.createElement('div');

        // Edit Button
        const editBtn = document.createElement('button');
        editBtn.className = 'action-btn edit-btn';
        editBtn.innerHTML = '✏️';
        editBtn.title = 'Edit Entry';
        editBtn.onclick = () => editEntry(item.key, item.val);

        // Delete Button
        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'action-btn delete-btn';
        deleteBtn.innerHTML = '🗑️';
        deleteBtn.title = 'Delete Entry';
        deleteBtn.onclick = () => deleteEntry(item.key);

        actionsDiv.appendChild(editBtn);
        actionsDiv.appendChild(deleteBtn);

        li.appendChild(textSpan);
        li.appendChild(actionsDiv);
        historyList.appendChild(li);
      });
    });

    // Edit entry in Firebase
    async function editEntry(key, currentVal) {
      const updatedVal = prompt("Modify feeding timestamp:", currentVal);
      if (updatedVal !== null && updatedVal.trim() !== "") {
        await db.ref(`history/${key}`).set(updatedVal.trim());
        updateLastFedFromHistory();
      }
    }

    // Delete entry from Firebase
    async function deleteEntry(key) {
      if (confirm("Delete this feeding record?")) {
        await db.ref(`history/${key}`).remove();
        updateLastFedFromHistory();
      }
    }

    // Record feeding timestamp
    async function feedLola() {
      const btn = document.getElementById('feedButton');
      const statusDiv = document.getElementById('status');

      btn.disabled = true;
      statusDiv.innerText = "Updating...";

      // Standard ISO timestamp for precise time tracking
      const isoTimestamp = new Date().toISOString();

      try {
        await Promise.all([
          db.ref('lastFed').set(isoTimestamp),
          db.ref('history').push(isoTimestamp)
        ]);

        statusDiv.innerText = "✅ Saved!";
      } catch (error) {
        console.error("Error updating database:", error);
        statusDiv.innerText = "❌ Error saving timestamp.";
      } finally {
        setTimeout(() => { 
          btn.disabled = false; 
          statusDiv.innerText = "";
        }, 2500);
      }
    }
  </script>
</body>
</html>
