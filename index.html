<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fed Lola</title>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f7f3ee;
      color: #3d312a;
    }

    .container {
      text-align: center;
      padding: 24px;
      max-width: 380px;
      width: 100%;
      box-sizing: border-box;
    }

    .cat-photo {
      width: 170px;
      height: 170px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #ffffff;
      box-shadow: 0 8px 20px rgba(61, 49, 42, 0.12);
      margin-bottom: 20px;
    }

    h1 {
      color: #3d312a;
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 26px;
    }

    .timestamp-box {
      background: #ffffff;
      border: 1px solid #e8decb;
      padding: 14px 20px;
      border-radius: 14px;
      margin-bottom: 22px;
      box-shadow: 0 4px 12px rgba(61, 49, 42, 0.05);
      font-size: 16px;
      color: #6e5c4f;
    }

    .timestamp-box strong {
      color: #3d312a;
      display: block;
      margin-top: 4px;
      font-size: 18px;
    }

    .feed-btn {
      background-color: #8c6239;
      color: #ffffff;
      border: none;
      border-radius: 50px;
      padding: 18px 40px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(140, 98, 57, 0.3);
      transition: transform 0.15s ease, background-color 0.2s ease;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      width: 100%;
    }

    .feed-btn:active {
      transform: scale(0.96);
      background-color: #704d2b;
    }

    .feed-btn:disabled {
      background-color: #c4b5a5;
      box-shadow: none;
      cursor: not-allowed;
    }

    #status {
      margin-top: 14px;
      font-size: 15px;
      font-weight: 600;
      color: #8c6239;
      min-height: 22px;
    }

    .history-card {
      background: #ffffff;
      border: 1px solid #e8decb;
      border-radius: 14px;
      padding: 16px 20px;
      margin-top: 22px;
      box-shadow: 0 4px 12px rgba(61, 49, 42, 0.05);
      text-align: left;
    }

    .history-card h3 {
      margin: 0 0 10px 0;
      font-size: 15px;
      color: #6e5c4f;
      border-bottom: 1px solid #f0e8dc;
      padding-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .history-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .history-list li {
      padding: 8px 0;
      font-size: 14px;
      color: #3d312a;
      border-bottom: 1px solid #f7f3ee;
    }

    .history-list li:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="lola.jpg" alt="Lola" class="cat-photo" onerror="this.style.display='none'">
    
    <h1>Fed Lola Today? 🐾</h1>
    
    <div class="timestamp-box">
      Last Fed: <strong id="lastFedTime">Loading...</strong>
    </div>

    <button id="feedButton" class="feed-btn" onclick="feedLola()">FED LOLA</button>
    <div id="status"></div>

    <div class="history-card">
      <h3>Recent Feeding History</h3>
      <ul id="historyList" class="history-list">
        <li>Loading history...</li>
      </ul>
    </div>
  </div>

  <script>
    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyAf4T7QPuiae3qBQePxH7K-Xz6nG7JUsh4",
      authDomain: "fed-lola.firebaseapp.com",
      databaseURL: "https://fed-lola-default-rtdb.firebaseio.com",
      projectId: "fed-lola",
      storageBucket: "fed-lola.firebasestorage.app",
      messagingSenderId: "1024504801806",
      appId: "1:1024504801806:web:053d531697417928366a5f"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Listen for most recent feeding time
    db.ref('lastFed').on('value', (snapshot) => {
      const val = snapshot.val();
      const target = document.getElementById('lastFedTime');
      if (target) {
        target.innerText = val ? val : "Not yet fed";
      }
    });

    // Fetch and display strictly the last 5 feedings
    db.ref('history').limitToLast(5).on('value', (snapshot) => {
      const historyList = document.getElementById('historyList');
      historyList.innerHTML = '';

      if (!snapshot.exists()) {
        historyList.innerHTML = '<li>No history recorded yet.</li>';
        return;
      }

      const items = [];
      snapshot.forEach((child) => {
        items.push(child.val());
      });

      // Show newest first
      items.reverse().forEach((timeStr) => {
        const li = document.createElement('li');
        li.innerText = `🐾 ${timeStr}`;
        historyList.appendChild(li);
      });
    });

    // Record feeding timestamp
    async function feedLola() {
      const btn = document.getElementById('feedButton');
      const statusDiv = document.getElementById('status');

      btn.disabled = true;
      statusDiv.innerText = "Updating...";

      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const dayStr = now.toLocaleDateString([], { weekday: 'long' });
      const formattedTime = `${timeStr} on ${dayStr}`;

      try {
        await Promise.all([
          db.ref('lastFed').set(formattedTime),
          db.ref('history').push(formattedTime)
        ]);

        statusDiv.innerText = "✅ Saved!";
      } catch (error) {
        console.error("Error updating database:", error);
        statusDiv.innerText = "❌ Error saving timestamp.";
      } finally {
        setTimeout(() => { 
          btn.disabled = false; 
          statusDiv.innerText = "";
        }, 2500);
      }
    }
  </script>
</body>
</html>
